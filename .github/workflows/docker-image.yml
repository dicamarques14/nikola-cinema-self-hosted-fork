name: Docker Image CI

on:
  workflow_dispatch:
  push:
    branches:
      # Publishes ghcr.io/<owner>/<repo>:movi-player (the metadata action's branch tag).
      - 'movi-player'
    tags:
      - 'v*'

jobs:
  docker:
    uses: webtor-io/.github/.github/workflows/docker-multiarch.yml@main
    permissions:
      contents: read
      packages: write
